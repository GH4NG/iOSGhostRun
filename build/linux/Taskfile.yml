version: '3'

includes:
    common: ../Taskfile.yml

tasks:
    build:
        summary: Builds the application for Linux
        deps:
            - task: common:go:mod:tidy
            - task: common:build:frontend
              vars:
                  BUILD_FLAGS:
                      ref: .BUILD_FLAGS
                  DEV:
                      ref: .DEV
        cmds:
            - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
        vars:
            BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.version={{.APP_VERSION | trimPrefix "v"}}"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.APP_VERSION | trimPrefix "v"}}"{{end}}'
            ARCH: '{{.ARCH | default ARCH}}'
            DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH | default ARCH}}'
            OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
        env:
            GOOS: linux
            CGO_ENABLED: 1
            GOARCH: '{{.ARCH | default ARCH}}'

    package:
        summary: Packages the application for Linux
        cmds:
            - task: create:appimage

    create:appimage:
        summary: Creates an AppImage
        dir: build/linux/appimage
        deps:
            - task: build
              vars:
                  ARCH: '{{.ARCH | default ARCH}}'
        cmds:
            - cp "{{.APP_BINARY}}" "{{.APP_NAME}}"
            - wails3 generate appimage -binary "{{.APP_NAME}}" -icon "{{.ICON}}" -desktopfile "{{.DESKTOP_FILE}}" -outputdir "{{.OUTPUT_DIR}}" -builddir "{{.ROOT_DIR}}/build/linux/appimage/build"
        vars:
            ARCH: '{{.ARCH | default ARCH}}'
            APP_NAME: '{{.APP_NAME}}'
            APP_BINARY: '../../../bin/{{.APP_NAME}}-{{.ARCH | default ARCH}}'
            ICON: '../com.iosghostrun.app.png'
            DESKTOP_FILE: '../com.iosghostrun.app.desktop'
            OUTPUT_DIR: '../../../bin'

    run:
        cmds:
            - '{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH | default ARCH}}'
