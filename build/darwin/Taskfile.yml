version: '3'

includes:
    common: ../Taskfile.yml

tasks:
    build:
        summary: Builds the application for macOS
        deps:
            - task: common:go:mod:tidy
            - task: common:build:frontend
              vars:
                  PRODUCTION: '{{.PRODUCTION}}'
                  BUILD_FLAGS:
                      ref: .BUILD_FLAGS
                  DEV:
                      ref: .DEV
        cmds:
            - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
        vars:
            BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.version={{.APP_VERSION | trimPrefix "v"}}"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.APP_VERSION | trimPrefix "v"}}"{{end}}'
            ARCH: '{{.ARCH | default ARCH}}'
            DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}'
            OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
        env:
            GOOS: darwin
            CGO_ENABLED: 1
            GOARCH: '{{.ARCH}}'

    package:
        summary: Packages separate AMD64 and ARM64 macOS app bundles
        cmds:
            - task: package:arch
              vars:
                  ARCH: amd64
            - task: package:arch
              vars:
                  ARCH: arm64

    package:arch:
        internal: true
        cmds:
            - task: build
              vars:
                  ARCH: '{{.ARCH}}'
            - task: create:app:bundle
              vars:
                  ARCH: '{{.ARCH}}'
            - ditto -c -k --norsrc --keepParent "{{.BIN_DIR}}/darwin-{{.ARCH}}/{{.APP_NAME}}.app" "{{.BIN_DIR}}/{{.APP_NAME}}-darwin-{{.ARCH}}.zip"

    create:app:bundle:
        summary: Creates an `.app` bundle for the selected architecture
        cmds:
            - mkdir -p "{{.BUNDLE_DIR}}/Contents/MacOS"
            - mkdir -p "{{.BUNDLE_DIR}}/Contents/Resources"
            - cp build/darwin/icons.icns "{{.BUNDLE_DIR}}/Contents/Resources"
            - cp build/darwin/Assets.car "{{.BUNDLE_DIR}}/Contents/Resources"
            - cp "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}" "{{.BUNDLE_DIR}}/Contents/MacOS/{{.APP_NAME}}"
            - cp build/darwin/Info.plist "{{.BUNDLE_DIR}}/Contents"
        vars:
            ARCH: '{{.ARCH | default ARCH}}'
            BUNDLE_DIR: '{{.BIN_DIR}}/darwin-{{.ARCH}}/{{.APP_NAME}}.app'

    run:
        cmds:
            - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
            - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
            - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
            - cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
            - cp "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH | default ARCH}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"
            - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
            - '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}'
